# Tells Grafana to load any *.json from /var/lib/grafana/dashboards on startup.
apiVersion: 1

providers:
  - name: 'currency-converter'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
